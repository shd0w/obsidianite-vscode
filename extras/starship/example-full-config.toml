# Example: a complete starship.toml
#
# This is a full, real-world config. It combines the Parrot OS style prompt
# from parrot-prompt.toml with Nerd Font symbols for every module
# (languages, tools, git, OS, battery...).
#
# Requires a Nerd Font in your terminal for the symbols to render.
# Install: back up ~/.config/starship.toml and copy this file over it.

"$schema" = 'https://starship.rs/config-schema.json'

add_newline=false


# Prompt no padrão do Parrot OS (duas linhas):
# ┌─[✗]─[usuario@host]─[~/caminho]      <- o [✗]─ só aparece quando o último comando falhou
# └──╼ $
format = '''[┌─](parrot_red)$status[\[](parrot_red)$username[@](bold parrot_yellow)$hostname[\]─\[](parrot_red)$directory[\]](parrot_red)$line_break[└──╼](parrot_red) $character'''

# Cores do prompt do Parrot. Troque os valores para mudar o tom
# (versão pastel: vermelho #ffb0a6, amarelo #ecd386, ciano #71dcd6, verde #b4e4a4).
palette = "parrot"

# Força explicitamente a renderização do Git antes de outras linguagens
right_format = '''$git_branch$git_status$all'''


[username]
show_always = true
format = "[$user]($style)"
style_user = "parrot_white"
style_root = "bold parrot_red"

[aws]
disabled = true
symbol = " "

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

[character]
disabled = false
format = "$symbol "
success_symbol = "[\\$](bold parrot_yellow)"
error_symbol = "[\\$](bold parrot_yellow)"

[container]
symbol = " "

[direnv]
symbol = " "

[directory]
read_only = " 󰌾"
format = "[$path]($style)[$read_only]($read_only_style)"
style = "parrot_green"
truncation_length = 8
truncate_to_repo = false

